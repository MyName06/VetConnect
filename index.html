<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetConnect — Sua clínica organizada em um só lugar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232CB199'/%3E%3Ccircle cx='16' cy='19' r='6' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --teal:#2CB199;--slate:#5A6A7A;
  --bg:#F5F8F8;--surface:#FFFFFF;--surface-2:#EEF3F4;--ink:#1A2029;--muted:#5A6A7A;--line:#DCE4E7;--line-soft:#E9EFF1;
  --btn-bg:#168270;--btn-bg-hover:#126F60;--btn-ink:#FFFFFF;
  --blue-bg:#2563EB;--blue-bg-hover:#1D4FD0;--blue-ink:#FFFFFF;
  --accent-soft:#E1F4F0;--accent-ink:#0F6B5C;
  --danger:#C0392B;--danger-soft:#FBE9E7;--danger-bg:#C0392B;--danger-ink:#FFFFFF;
  --warn:#9A6212;--warn-soft:#FDF1D8;--ok:#1B7F45;--ok-soft:#E0F3E7;
  --shadow-1:0 1px 2px rgba(26,32,41,.06),0 1px 1px rgba(26,32,41,.04);
  --shadow-2:0 10px 28px rgba(26,32,41,.12),0 2px 6px rgba(26,32,41,.06);
  --ease:cubic-bezier(.2,.7,.2,1);--t:160ms;
  --topbar:60px;
}
:root[data-theme=dark]{
  --bg:#1A2029;--surface:#232C38;--surface-2:#2B3543;--ink:#EDF2F5;--muted:#9FB0BE;--line:#364252;--line-soft:#2E3947;
  --btn-bg:#2CB199;--btn-bg-hover:#3CC4AB;--btn-ink:#0E1B1A;
  --blue-bg:#5B8DF7;--blue-bg-hover:#7AA3FA;--blue-ink:#0B1220;
  --accent-soft:#1D3A37;--accent-ink:#72E3CE;
  --danger:#F28B82;--danger-soft:#3B2523;--danger-bg:#F28B82;--danger-ink:#2A0F0C;
  --warn:#F2C46D;--warn-soft:#3A3220;--ok:#6FD39A;--ok-soft:#1F3A2B;
  --shadow-1:0 1px 2px rgba(0,0,0,.30);
  --shadow-2:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100vh;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ico{flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;cursor:pointer}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--teal);display:grid;place-items:center;color:#0E2B26}
.spacer{flex:1}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:40px;padding:0 var(--sp-4);border-radius:var(--r-sm);border:1px solid transparent;background:var(--btn-bg);color:var(--btn-ink);font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--t) var(--ease),transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.btn:hover{background:var(--btn-bg-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.blue{background:var(--blue-bg);color:var(--blue-ink)}
.btn.blue:hover{background:var(--blue-bg-hover)}
.btn.danger{background:var(--danger-bg);color:var(--danger-ink)}
.btn.ghost.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.ghost.danger:hover{background:var(--danger-soft)}
.btn.sm{height:32px;padding:0 var(--sp-3);font-size:13px}
.btn.block{width:100%}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.field>span{font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
textarea{min-height:84px;resize:vertical;line-height:1.45}
select[size]{padding:4px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted)}
input[type=color]{width:48px;height:42px;padding:3px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--teal)}
.switch{display:flex;align-items:center;gap:var(--sp-3);cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background var(--t);flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:transform var(--t) var(--ease)}
.switch input:checked+.sw{background:var(--teal)}
.switch input:checked+.sw::after{transform:translateX(18px)}
.switch input:focus-visible+.sw{outline:2px solid var(--teal);outline-offset:2px}
.grid1{display:flex;flex-direction:column;gap:var(--sp-4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4)}
.inline{display:flex;gap:var(--sp-2)}
.section-title{font-size:14px;font-weight:600;color:var(--muted);padding-top:var(--sp-2);border-top:1px solid var(--line-soft)}
.section-title:first-child{border-top:0;padding-top:0}
.hint{font-size:13px;color:var(--muted)}
.form-msg{min-height:20px;font-size:14px;color:var(--danger)}
.form-msg.ok{color:var(--ok)}

/* estrutura */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--shadow-1)}
.card+.card{margin-top:var(--sp-4)}
.main{padding:var(--sp-6);max-width:1320px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.page-head p{margin-top:2px}
.head-actions{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.seg{display:flex;align-items:center;gap:2px}
.select-sm{width:auto;min-height:40px}
.tabs{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--line);margin-bottom:var(--sp-5);overflow-x:auto}
.tab{padding:10px 16px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--t) var(--ease),border-color var(--t) var(--ease)}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent-ink);border-color:var(--teal)}
.toolbar{display:flex;gap:var(--sp-4);align-items:center;margin-bottom:var(--sp-4);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:240px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:40px}
.empty{padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--muted)}
.loading{padding:var(--sp-7);text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5)}
.stat strong{display:block;font-size:26px;letter-spacing:-.02em;font-weight:600}
.stat span{color:var(--muted);font-size:14px}

/* tabelas */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--t) var(--ease)}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td .sub{display:block;font-size:13px;color:var(--muted)}
td.num,th.num{text-align:right}
td.actions{text-align:right;white-space:nowrap}
.swatch-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.b-agendado{background:var(--accent-soft);color:var(--accent-ink)}
.b-presente,.b-pago{background:var(--ok-soft);color:var(--ok)}
.b-faltou,.b-pendente{background:var(--warn-soft);color:var(--warn)}
.b-cancelado,.b-obito{background:var(--danger-soft);color:var(--danger)}

/* modal e avisos */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(14,20,28,.55);display:grid;place-items:center;padding:var(--sp-4);animation:fade 160ms var(--ease)}
.modal-back.out{opacity:0;transition:opacity 160ms}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);animation:pop 200ms var(--ease)}
.modal.wide{width:min(920px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line)}
.modal-body{padding:var(--sp-5);overflow:auto;display:flex;flex-direction:column;gap:var(--sp-4)}
.modal-foot{display:flex;justify-content:flex-end;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .grow{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
#toasts{position:fixed;right:var(--sp-5);bottom:var(--sp-5);z-index:200;display:flex;flex-direction:column;gap:var(--sp-2);max-width:min(420px,calc(100vw - 32px))}
.toast{padding:12px 16px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg);box-shadow:var(--shadow-2);font-size:14px;animation:pop 200ms var(--ease);transition:opacity 200ms,transform 200ms}
.toast.err{background:var(--danger-bg);color:var(--danger-ink)}
.toast.out{opacity:0;transform:translateY(6px)}

/* login */
.auth{min-height:calc(100vh - var(--topbar));display:grid;grid-template-columns:1.1fr 1fr}
.auth-hero{background:#146B5C;color:#fff;display:flex;align-items:center;padding:var(--sp-7)}
:root[data-theme=dark] .auth-hero{background:#12332E}
.auth-hero h1{font-size:clamp(32px,4.2vw,50px);line-height:1.08;max-width:15ch;letter-spacing:-.03em}
.auth-hero p{margin-top:var(--sp-4);font-size:18px;opacity:.92}
.auth-wrap{display:grid;place-items:center;padding:var(--sp-6)}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:var(--sp-4)}

/* menu lateral */
.side{position:fixed;left:0;top:var(--topbar);bottom:0;width:64px;z-index:30;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--sp-2);overflow:hidden;transition:width 200ms var(--ease),box-shadow 200ms var(--ease)}
body[data-page=dashboard] .side{display:none}
.side:hover,.side.pinned{width:248px}
.side:hover:not(.pinned){box-shadow:var(--shadow-2)}
.side-top{display:flex;justify-content:flex-end;height:40px;align-items:center}
.pin{opacity:0;transition:opacity 150ms,background var(--t),color var(--t)}
.side:hover .pin,.side.pinned .pin{opacity:1}
.pin[aria-pressed=true]{color:var(--accent-ink);background:var(--accent-soft)}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);height:44px;padding:0 14px;width:100%;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;text-align:left;font-weight:500;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.nav-item .lbl{opacity:0;transition:opacity 150ms}
.side:hover .lbl,.side.pinned .lbl{opacity:1}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink)}
body[data-page=inner] .shell{padding-left:64px}
body.side-pinned[data-page=inner] .shell{padding-left:248px}
.shell{transition:padding-left 200ms var(--ease)}

/* dashboard */
.dash{text-align:center;padding:var(--sp-6) 0 var(--sp-7)}
.dash-sub{margin-top:var(--sp-2);font-size:18px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--sp-4);margin:var(--sp-7) auto 0;max-width:900px;text-align:left}
.dash-card{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-5);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.dash-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:color-mix(in srgb,var(--teal) 55%,var(--line))}
.dash-card strong{font-size:16px}
.dash-card .muted{font-size:14px}
.dash-ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:var(--sp-3)}

/* agenda */
.cal-wrap{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1);overflow:auto;max-height:calc(100vh - 210px)}
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(132px,1fr));min-width:1000px}
.cal-corner,.cal-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-head{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-left:1px solid var(--line-soft);color:var(--muted);font-size:13px}
.cal-head strong{font-size:20px;color:var(--ink);font-weight:600;line-height:1.25;min-width:34px;text-align:center;padding:0 6px;border-radius:999px}
.cal-head.today strong{background:var(--teal);color:#0E2B26}
.cal-times{position:relative}
.cal-time{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.cal-time:first-child{transform:translateY(4px)}
.cal-col{position:relative;border-left:1px solid var(--line-soft);background-image:linear-gradient(to bottom,var(--line-soft) 1px,transparent 1px);cursor:cell}
.shade{position:absolute;left:0;right:0;background-color:color-mix(in srgb,var(--surface-2) 75%,transparent);background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--muted) 12%,transparent) 6px 7px);pointer-events:none}
.ev{position:absolute;border:0;border-radius:8px;padding:4px 8px;text-align:left;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;font-size:12.5px;line-height:1.3;box-shadow:var(--shadow-1);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow-2);z-index:2}
.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.ev span{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.st-faltou{opacity:.55}
.ev-ok{position:absolute;top:4px;right:4px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.detail-top{display:flex;gap:var(--sp-3);align-items:center}
.detail-top .grow{flex:1}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:var(--sp-2) var(--sp-4)}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* seleção de paciente */
.pp-list{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-3)}
.pp-item{display:flex;flex-wrap:wrap;gap:2px var(--sp-4);align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;transition:border-color var(--t),background var(--t)}
.pp-item:hover{border-color:var(--teal);background:var(--accent-soft)}
.pp-item .muted{font-size:13px}
.pp-hint{padding:var(--sp-3) 0}
.patient-head{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);align-items:center;margin-bottom:var(--sp-4)}
.patient-head .meta{display:flex;flex-wrap:wrap;gap:4px var(--sp-4);font-size:14px;color:var(--muted)}

/* vacinas */
.vc-table input{min-height:36px;padding:6px 8px;font-size:14px}
.vc-table td{padding:6px 6px}
.vc-table th{padding:10px 6px}
.vc-table tr.saved td{background:var(--ok-soft)}
.vc-table td{transition:background 600ms}
.vc-block+.vc-block{margin-top:var(--sp-5)}
.vc-block h3{margin-bottom:var(--sp-3);display:flex;justify-content:space-between;align-items:center}

/* horários */
.hrow{display:grid;grid-template-columns:150px 110px 1fr 1fr;gap:var(--sp-3);align-items:center;padding:6px 0}
.hrow label{display:flex;align-items:center;gap:8px;font-size:14px}
.hrow input[type=time]{width:130px}
.hrow .hday{font-weight:500}
.hrow.uni{grid-template-columns:150px 1fr 1fr}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3)}
.method{position:relative}
.method input{position:absolute;opacity:0;width:1px;height:1px}
.method span{display:block;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);text-align:center;font-weight:600;cursor:pointer;transition:border-color var(--t),background var(--t)}
.method input:checked+span{border-color:var(--teal);background:var(--accent-soft);color:var(--accent-ink)}
.method input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.swatches{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform var(--t)}
.swatch:hover{transform:scale(1.12)}
.cfg-layout{display:grid;grid-template-columns:220px 1fr;gap:var(--sp-5);align-items:start}
.cfg-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--topbar) + var(--sp-4))}
.cfg-nav .nav-item{height:40px}
.cfg-nav .nav-item .lbl{opacity:1}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:12px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:0}
.list-row .sub{font-size:13px;color:var(--muted)}
.diff{display:grid;grid-template-columns:150px 1fr 1fr;gap:var(--sp-2) var(--sp-3);font-size:13.5px}
.diff .h{font-weight:600;color:var(--muted)}
.diff .old{color:var(--danger);word-break:break-word}
.diff .new{color:var(--ok);word-break:break-word}
.pr-id{background:var(--surface-2);border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-4);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-2) var(--sp-4);font-size:14px}
.pr-id small{display:block;color:var(--muted);font-size:12.5px}
fieldset{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
legend{padding:0 8px;font-weight:600;font-size:14px}

@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-hero{padding:var(--sp-6) var(--sp-5)}
  .cfg-layout{grid-template-columns:1fr}
  .cfg-nav{position:static;flex-direction:row;overflow-x:auto}
}
@media (max-width:760px){
  .grid2,.grid3{grid-template-columns:1fr}
  .side{top:auto;bottom:0;left:0;right:0;width:100%;height:60px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .side:hover,.side.pinned{width:100%}
  .side-top{display:none}
  .side-nav{flex-direction:row;justify-content:space-around}
  .nav-item{justify-content:center;padding:0;flex:1}
  .nav-item .lbl{display:none}
  body[data-page=inner] .shell,body.side-pinned[data-page=inner] .shell{padding-left:0;padding-bottom:72px}
  .main{padding:var(--sp-4)}
  .hrow{grid-template-columns:1fr 1fr}
  .hrow .hday{grid-column:1/-1}
  .topbar{padding:0 var(--sp-4)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<body>
<header class="topbar">
  <button class="brand" id="brandLink" aria-label="VetConnect"><span class="brand-mark"><svg class="ico" width="18" height="18" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>VetConnect</button>
  <span class="spacer"></span>

</header>
<div id="view"></div>
<div id="print-area" aria-hidden="true"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =====================================================================
   VetConnect — conectado ao Supabase
   A chave abaixo é a chave PÚBLICA (publishable). Ela pode ficar no site:
   quem protege os dados são as regras RLS criadas no banco.
   NUNCA coloque a chave "secret" / "service_role" neste arquivo.
   ===================================================================== */
const SUPABASE_URL = 'https://sgpvsdavzkwugozdsmhw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SHKN4la5jcucQVoXtfExFA_8ZiLDmdn';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = { uid: null, email: null, perfil: null, clinica: null, especies: [], procedimentos: [], profissionais: [], horarios: [], pacientes: null, page: null };
const isAdmin = () => state.perfil && state.perfil.papel === 'admin';

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignora */ } }
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const money = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtHoras = h => Number(h).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' h';
const fmtDate = v => {
  if (!v) return '—';
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + 'T00:00:00') : new Date(v);
  return d.toLocaleDateString('pt-BR');
};
const fmtDateTime = v => v ? new Date(v).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const toMin = t => { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); };
const digits = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const DIAS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const DIAS_CURTOS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const ORDEM_DIAS = [1, 2, 3, 4, 5, 6, 0];
const FORMA = { pix: 'Pix', dinheiro: 'Dinheiro', debito: 'Débito', credito: 'Crédito', credito_parcelado: 'Crédito parcelado' };
const STATUS = { agendado: 'Agendado', presente: 'Presente', faltou: 'Faltou', cancelado: 'Cancelado', pendente: 'Pendente', pago: 'Pago' };
const badge = s => `<span class="badge b-${s}">${STATUS[s] || s}</span>`;

const maskCPF = v => {
  v = digits(v).slice(0, 11);
  return v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
};
const maskPhone = v => {
  v = digits(v).slice(0, 11);
  if (v.length <= 2) return v;
  if (v.length <= 6) return `(${v.slice(0, 2)}) ${v.slice(2)}`;
  if (v.length <= 10) return `(${v.slice(0, 2)}) ${v.slice(2, 6)}-${v.slice(6)}`;
  return `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
};
const maskCEP = v => { v = digits(v).slice(0, 8); return v.length > 5 ? v.slice(0, 5) + '-' + v.slice(5) : v; };
function validCPF(c) {
  c = digits(c);
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += c[i] * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(c[t])) return false;
  }
  return true;
}
// nomes não aceitam números; telefone só aceita números; CPF e CEP com máscara
document.addEventListener('input', e => {
  const t = e.target, m = t.dataset && t.dataset.mask;
  if (!m) return;
  if (m === 'cpf') t.value = maskCPF(t.value);
  else if (m === 'phone') t.value = maskPhone(t.value);
  else if (m === 'cep') t.value = maskCEP(t.value);
  else if (m === 'name') t.value = t.value.replace(/[0-9]/g, '');
});

const textOn = hex => {
  let c = String(hex || '#2CB199').replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const n = parseInt(c, 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 120 ? '#1A2029' : '#FFFFFF';
};
function idade(nasc) {
  if (!nasc) return '';
  const n = new Date(nasc + 'T00:00:00'), h = new Date();
  let m = (h.getFullYear() - n.getFullYear()) * 12 + h.getMonth() - n.getMonth();
  if (h.getDate() < n.getDate()) m--;
  if (m < 0) return '';
  const a = Math.floor(m / 12), r = m % 12;
  return a ? `${a} ano${a > 1 ? 's' : ''}${r ? ` e ${r} ${r > 1 ? 'meses' : 'mês'}` : ''}` : `${r} ${r === 1 ? 'mês' : 'meses'}`;
}

/* ---------- ícones ---------- */
const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  paw: '<circle cx="6" cy="11" r="2"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><circle cx="18" cy="11" r="2"/><path d="M12 12c-3 0-5 3-5 5.5 0 1.5 1 2.5 2.5 2.5 1 0 1.5-.5 2.5-.5s1.5.5 2.5.5c1.5 0 2.5-1 2.5-2.5C17 15 15 12 12 12z"/>',
  clipboard: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  wallet: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  pin: '<path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon: '<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  printer: '<path d="M7 9V3h10v6M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2"/><rect x="7" y="14" width="10" height="7"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  chevL: '<path d="M15 6l-6 6 6 6"/>',
  chevR: '<path d="M9 6l6 6-6 6"/>',
  logout: '<path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'
};
const ico = (n, s = 20) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- avisos, erros e janelas ---------- */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, 4200);
}
function sbErr(error, fallback = 'Não foi possível concluir a ação.') {
  if (!error) return null;
  console.error(error);
  const c = error.code, m = error.message || '';
  if (c === '23P01') return 'Esse horário já está ocupado para o profissional.';
  if (c === '23505') return 'Já existe um registro com esses dados (CPF, registro ou nome repetido).';
  if (c === '23503') return 'Este registro está ligado a outros dados e não pode ser removido ou usado assim.';
  if (c === '42501' || /row-level security/i.test(m)) return 'Você não tem permissão para esta ação.';
  if (c === 'P0001') return m;
  return `${fallback} (${m})`;
}
const fail = (error, fallback) => toast(sbErr(error, fallback), 'err');

function openModal({ title, body, footer = '', wide = false, locked = false, onClose }) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header class="modal-head"><h2>${esc(title)}</h2>${locked ? '' : `<button class="icon-btn" data-close aria-label="Fechar">${ico('x')}</button>`}</header>
    <div class="modal-body">${body}</div>${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}</div>`;
  document.body.appendChild(back);
  back.locked = locked;
  back.close = () => { if (back.isConnected) { back.classList.add('out'); setTimeout(() => back.remove(), 160); onClose && onClose(); } };
  back.shut = () => { back.classList.add('out'); setTimeout(() => back.remove(), 160); };
  if (!locked) {
    back.addEventListener('mousedown', e => { if (e.target === back) back.close(); });
    const x = $('[data-close]', back); if (x) x.onclick = back.close;
  }
  const first = $('input:not([type=hidden]),select,textarea', back.querySelector('.modal-body'));
  if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
  return back;
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const all = $$('.modal-back');
  const top = all[all.length - 1];
  if (top && !top.locked) top.close();
});
function confirmBox(message, okLabel = 'Confirmar', danger = false) {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title: 'Confirmar', body: `<p>${esc(message)}</p>`,
      footer: `<button class="btn ghost" data-no>Cancelar</button><button class="btn ${danger ? 'danger' : ''}" data-yes>${esc(okLabel)}</button>`,
      onClose: () => { if (!done) { done = true; res(false); } }
    });
    $('[data-no]', m).onclick = () => m.close();
    $('[data-yes]', m).onclick = () => { done = true; res(true); m.shut(); };
  });
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } finally { if (btn) btn.disabled = false; }
}

/* ---------- tema ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  store.set('vc-theme', t);
  const b = $('#themeBtn');
  if (b) b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon');
}

/* ---------- entrada: login e cadastro ---------- */
function authErr(e) {
  const m = e.message || '';
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/already registered|already been registered/i.test(m)) return 'Já existe uma conta com este e-mail.';
  if (/not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
  if (/password/i.test(m) && /6/.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
  return 'Não foi possível entrar: ' + m;
}
function renderAuth(mode = 'login') {
  document.body.dataset.page = 'auth';
  document.body.classList.remove('side-pinned');
  const reg = mode === 'register';
  $('#view').innerHTML = `<div class="auth">
    <section class="auth-hero"><div><h1>Sua clínica organizada em um só lugar.</h1><p>${reg ? 'Crie o acesso da sua clínica.' : 'Entre com e-mail e senha.'}</p></div></section>
    <section class="auth-wrap"><form class="auth-card" id="authForm" novalidate>
      <h2>${reg ? 'Criar conta' : 'Entrar'}</h2>
      ${reg ? `<label class="field"><span>Nome do negócio</span><input type="text" name="negocio" autocomplete="organization" required></label>
      <label class="field"><span>Usuário (seu nome)</span><input type="text" name="usuario" autocomplete="name" required></label>` : ''}
      <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="email" required></label>
      <label class="field"><span>Senha</span><input type="password" name="senha" minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}" required></label>
      <p class="form-msg" id="authMsg" role="alert"></p>
      ${reg ? `<button class="btn blue block" type="submit">Criar conta</button><button class="btn ghost block" type="button" id="toLogin">Já tenho conta</button>`
            : `<button class="btn block" type="submit">Entrar</button><button class="btn blue block" type="button" id="toReg">Registre-se</button>`}
    </form></section></div>`;
  const tl = $('#toLogin'); if (tl) tl.onclick = () => renderAuth('login');
  const tr = $('#toReg'); if (tr) tr.onclick = () => renderAuth('register');
  $('#authForm').onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target), msg = $('#authMsg');
    msg.className = 'form-msg'; msg.textContent = '';
    const email = String(f.get('email') || '').trim(), senha = String(f.get('senha') || '');
    if (!email || !senha) { msg.textContent = 'Preencha e-mail e senha.'; return; }
    const btn = $('button[type=submit]', ev.target);
    btn.disabled = true;
    try {
      if (reg) {
        const negocio = String(f.get('negocio') || '').trim(), usuario = String(f.get('usuario') || '').trim();
        if (!negocio || !usuario) { msg.textContent = 'Informe o nome do negócio e o usuário.'; return; }
        if (senha.length < 6) { msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
        const { data, error } = await sb.auth.signUp({ email, password: senha, options: { data: { nome_negocio: negocio, usuario } } });
        if (error) { msg.textContent = authErr(error); return; }
        if (!data.session) { msg.className = 'form-msg ok'; msg.textContent = 'Conta criada. Enviamos um e-mail de confirmação: confirme e depois entre.'; }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: senha });
        if (error) msg.textContent = authErr(error);
      }
    } finally { btn.disabled = false; }
  };
}
function renderFatal(msg) {
  document.body.dataset.page = 'auth';
  $('#view').innerHTML = `<div class="auth-wrap" style="min-height:70vh"><div class="auth-card"><h2>Algo deu errado</h2><p class="muted">${esc(msg)}</p><button class="btn" id="fatalOut">Sair</button></div></div>`;
  $('#fatalOut').onclick = () => sb.auth.signOut();
}

/* ---------- carregamento inicial ---------- */
function resetState() {
  Object.assign(state, { uid: null, email: null, perfil: null, clinica: null, especies: [], procedimentos: [], profissionais: [], horarios: [], pacientes: null, page: null });
}
async function loadRefs() {
  const [e, p, pr, h, ph] = await Promise.all([
    sb.from('especies').select('*'),
    sb.from('procedimentos').select('*').order('nome'),
    sb.from('profissionais').select('*').order('nome'),
    sb.from('horarios_funcionamento').select('*'),
    sb.from('profissional_horarios').select('*')
  ]);
  [e, p, pr, h, ph].forEach(r => { if (r.error) fail(r.error, 'Não foi possível carregar os dados da clínica.'); });
  state.especies = (e.data || []).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  state.procedimentos = p.data || [];
  state.horarios = h.data || [];
  const phs = ph.data || [];
  state.profissionais = (pr.data || []).map(x => ({ ...x, horarios: phs.filter(y => y.profissional_id === x.id) }));
  state.pacientes = null;
}
async function getPacientes(force = false) {
  if (!state.pacientes || force) {
    const { data, error } = await sb.from('pacientes').select('*, especies(nome), tutores(nome, cpf, telefone, endereco)').order('nome');
    if (error) { fail(error, 'Não foi possível carregar os pacientes.'); return []; }
    state.pacientes = data;
  }
  return state.pacientes;
}
let booting = null;
function ensureBoot() {
  if (booting) return booting;
  booting = (async () => {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { resetState(); renderAuth(); return; }
      if (state.uid === session.user.id && state.perfil) return;
      await boot(session);
    } finally { booting = null; }
  })();
  return booting;
}
async function boot(session) {
  state.uid = session.user.id; state.email = session.user.email;
  const { data: perfil, error } = await sb.from('perfis').select('*, clinicas(*)').eq('id', state.uid).maybeSingle();
  if (error || !perfil) { renderFatal('Não encontramos a clínica ligada a este usuário. Saia e entre novamente; se continuar, confirme que o script SQL foi executado por completo.'); return; }
  state.perfil = perfil; state.clinica = perfil.clinicas;
  await loadRefs();
  renderShell();
  go('dashboard');
  if (isAdmin() && !state.clinica.cidade && !state.clinica.cep && state.horarios.length === 0) startOnboarding();
}

/* ---------- estrutura e navegação ---------- */
const NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: 'home', desc: '' },

/* =====================================================================
   AGENDAMENTOS
   ===================================================================== */
const HOUR_H = 56;
const SEL_AG = '*, pacientes(nome, registro, tutores(nome, telefone, cpf)), procedimentos(nome, cor, preco, duracao_horas), profissionais(nome)';
function mondayOf(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
const agenda = { start: mondayOf(new Date()), prof: '', items: [] };

function hoursFor(dow) {
  const h = state.horarios.find(x => x.dia_semana === dow);
  if (h) return { abre: h.abre ? h.abre.slice(0, 5) : null, fecha: h.fecha ? h.fecha.slice(0, 5) : null, fechado: !!h.fechado };
  if (state.horarios.length) return { fechado: true };
  return { abre: '08:00', fecha: '18:00', fechado: dow === 0 };
}
function gridRange(items) {
  let min = 24 * 60, max = 0;
  for (let d = 0; d < 7; d++) {
    const h = hoursFor(d);
    if (h.fechado || !h.abre || !h.fecha) continue;
    min = Math.min(min, toMin(h.abre)); max = Math.max(max, toMin(h.fecha));
  }
  if (min >= max) { min = 8 * 60; max = 18 * 60; }
  items.forEach(a => {
    const s = new Date(a.inicio), e = new Date(a.fim);
    min = Math.min(min, s.getHours() * 60 + s.getMinutes());
    max = Math.max(max, ymd(s) === ymd(e) ? e.getHours() * 60 + e.getMinutes() : 24 * 60);
  });
  return { min: Math.floor(min / 60) * 60, max: Math.ceil(max / 60) * 60 };
}
function layoutLanes(list) {
  list.sort((a, b) => a.s - b.s || a.e - b.e);
  const out = []; let cluster = [], clusterEnd = 0;
  const flush = () => {
    if (!cluster.length) return;
    const laneEnds = [];
    cluster.forEach(it => {
      let l = laneEnds.findIndex(e => e <= it.s);
      if (l < 0) { l = laneEnds.length; laneEnds.push(it.e); } else laneEnds[l] = it.e;
      it.lane = l;
    });
    cluster.forEach(it => { it.lanes = laneEnds.length; });
    out.push(...cluster); cluster = []; clusterEnd = 0;
  };
  list.forEach(it => {
    if (cluster.length && it.s >= clusterEnd) flush();
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  });
  flush();
  return out;
}

function renderAgenda() {

    <div class="head-actions">

      <div class="seg"><button class="icon-btn" id="agPrev" aria-label="Semana anterior">${ico('chevL')}</button><button class="btn ghost sm" id="agToday">Hoje</button><button class="icon-btn" id="agNext" aria-label="Próxima semana">${ico('chevR')}</button></div>
      <button class="btn" id="agNew">${ico('plus')}Novo agendamento</button></div></div>
    <div class="cal-wrap" id="agBody"><div class="loading">Carregando agenda…</div></div>`;

async function loadAgenda() {
  const end = new Date(agenda.start); end.setDate(end.getDate() + 7);
  const last = new Date(end); last.setDate(last.getDate() - 1);
  const rng = $('#agRange');
  if (rng) rng.textContent = `${agenda.start.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })} a ${last.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', year: 'numeric' })}`;
  const { data, error } = await sb.from('agendamentos').select(SEL_AG)
    .gte('inicio', agenda.start.toISOString()).lt('inicio', end.toISOString())
    .neq('status', 'cancelado').order('inicio');
  if (error) { fail(error, 'Não foi possível carregar a agenda.'); agenda.items = []; } else agenda.items = data;
  if (state.page === 'agenda') drawCalendar();
}
function evHTML(it, range) {
  const a = it.a, s = new Date(it.s);
  const top = (s.getHours() * 60 + s.getMinutes() - range.min) / 60 * HOUR_H;
  const hgt = Math.max((it.e - it.s) / 3600000 * HOUR_H - 2, 24);
  const w = 100 / it.lanes;
  const cor = (a.procedimentos && a.procedimentos.cor) || '#2CB199';
  return `<button class="ev st-${a.status}" data-id="${a.id}" style="top:${top}px;height:${hgt}px;left:calc(${it.lane * w}% + 2px);width:calc(${w}% - 4px);background:${esc(cor)};color:${textOn(cor)}">
    <b>${hm(s)} ${esc(a.pacientes ? a.pacientes.nome : '')}</b><span>${esc(a.procedimentos ? a.procedimentos.nome : '')}</span>${a.status === 'presente' ? `<i class="ev-ok">${ico('check', 14)}</i>` : ''}</button>`;
}
function drawCalendar() {
  const box = $('#agBody'); if (!box) return;
  const items = agenda.items.filter(a => !agenda.prof || a.profissional_id === agenda.prof);
  const range = gridRange(items), total = (range.max - range.min) / 60 * HOUR_H;
  const days = [...Array(7)].map((_, i) => { const d = new Date(agenda.start); d.setDate(d.getDate() + i); return d; });
  const todayKey = ymd(new Date());
  let html = '<div class="cal"><div class="cal-corner"></div>';
  days.forEach(d => { html += `<div class="cal-head ${ymd(d) === todayKey ? 'today' : ''}"><span>${DIAS_CURTOS[d.getDay()]}</span><strong>${d.getDate()}</strong></div>`; });
  html += `<div class="cal-times" style="height:${total}px">`;
  for (let m = range.min; m < range.max; m += 60) html += `<div class="cal-time" style="top:${(m - range.min) / 60 * HOUR_H}px">${pad(m / 60)}:00</div>`;
  html += '</div>';
  days.forEach(d => {
    const key = ymd(d), h = hoursFor(d.getDay());
    let shades = '';
    if (h.fechado || !h.abre || !h.fecha) shades = `<div class="shade" style="top:0;height:${total}px"></div>`;
    else {
      const a = (toMin(h.abre) - range.min) / 60 * HOUR_H, f = (toMin(h.fecha) - range.min) / 60 * HOUR_H;
      shades = `<div class="shade" style="top:0;height:${Math.max(a, 0)}px"></div><div class="shade" style="top:${f}px;height:${Math.max(total - f, 0)}px"></div>`;
    }
    const dayItems = items.filter(a => ymd(new Date(a.inicio)) === key).map(a => ({ a, s: +new Date(a.inicio), e: +new Date(a.fim) }));
    const evs = layoutLanes(dayItems).map(it => evHTML(it, range)).join('');
    let now = '';
    if (key === todayKey) {
      const n = new Date(), mm = n.getHours() * 60 + n.getMinutes();
      if (mm >= range.min && mm <= range.max) now = `<div class="now" style="top:${(mm - range.min) / 60 * HOUR_H}px"></div>`;
    }
    html += `<div class="cal-col" data-date="${key}" style="height:${total}px;background-size:100% ${HOUR_H}px">${shades}${evs}${now}</div>`;
  });
  html += '</div>';
  box.innerHTML = html;
  $$('.ev', box).forEach(b => b.onclick = ev => { ev.stopPropagation(); openAgDetail(b.dataset.id); });
  $$('.cal-col', box).forEach(col => col.onclick = ev => {
    if (ev.target.closest('.ev')) return;
    const y = ev.clientY - col.getBoundingClientRect().top;
    const mins = range.min + Math.floor(y / HOUR_H * 2) * 30;
    openAgForm({ date: col.dataset.date, time: `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}` });
  });
}

/* ---------- detalhe do agendamento ---------- */
function openAgDetail(id) {
  const a = agenda.items.find(x => x.id === id); if (!a) return;
  const s = new Date(a.inicio), e = new Date(a.fim), now = new Date();
  const opens = new Date(s.getTime() - 30 * 60000);
  const canPresence = a.status === 'agendado' && now >= opens;
  const started = s <= now;
  const cor = (a.procedimentos && a.procedimentos.cor) || '#2CB199';
  const tut = a.pacientes && a.pacientes.tutores;
  const body = `<div class="detail-top"><span class="dot" style="background:${esc(cor)}"></span><div class="grow"><h3>${esc(a.pacientes ? a.pacientes.nome : '')}</h3><p class="muted">${esc(a.procedimentos ? a.procedimentos.nome : '')}</p></div>${badge(a.status)}</div>
    <dl class="kv">
      <dt>Horário</dt><dd>${esc(s.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }))}, ${hm(s)} às ${hm(e)}</dd>
      <dt>Tutor</dt><dd>${esc(tut ? tut.nome : '—')}${tut && tut.telefone ? `<span class="muted"> — ${esc(tut.telefone)}</span>` : ''}</dd>
      <dt>Profissional</dt><dd>${esc(a.profissionais ? a.profissionais.nome : 'Não definido')}</dd>
      <dt>Valor</dt><dd>${money(a.procedimentos ? a.procedimentos.preco : 0)}</dd>
      ${a.observacoes ? `<dt>Observações</dt><dd>${esc(a.observacoes)}</dd>` : ''}
    </dl>
    ${a.status === 'agendado' && !canPresence ? `<p class="hint">A presença pode ser confirmada a partir das ${hm(opens)}.</p>` : ''}`;
  const canPront = started && (a.status === 'presente' || a.status === 'agendado');
  const footer = `${a.status === 'agendado' ? `<button class="btn ghost danger grow" data-act="cancel">Cancelar agendamento</button>` : ''}
    ${a.status === 'agendado' ? `<button class="btn ghost" data-act="edit">${ico('edit', 16)}Editar</button>` : ''}
    ${a.status === 'agendado' && started ? `<button class="btn ghost" data-act="miss">Faltou</button>` : ''}
    ${canPront ? `<button class="btn ghost" data-act="pront">${ico('file', 16)}Prontuário</button>` : ''}
    ${a.status === 'agendado' ? `<button class="btn" data-act="present" ${canPresence ? '' : 'disabled'}>${ico('check', 16)}Confirmar presença</button>` : ''}`;
  const m = openModal({ title: 'Agendamento', body, footer });
  const on = (act, fn) => { const b = $(`[data-act=${act}]`, m); if (b) b.onclick = () => busy(b, fn); };
  const setStatus = async status => {
    const { error } = await sb.from('agendamentos').update({ status }).eq('id', a.id);
    if (error) { fail(error); return false; }
    m.close(); await loadAgenda(); return true;
  };
  on('present', async () => {
    if (!(await setStatus('presente'))) return;
    toast('Presença confirmada. A cobrança foi gerada no Financeiro.');
    const { data: fin } = await sb.from('financeiro').select(SEL_FIN).eq('agendamento_id', a.id).maybeSingle();
    if (fin) openPagamento(fin);
  });
  on('miss', async () => { if (await setStatus('faltou')) toast('Falta registrada.'); });
  on('cancel', async () => {
    if (!(await confirmBox('Cancelar este agendamento? O horário será liberado.', 'Cancelar agendamento', true))) return;
    if (await setStatus('cancelado')) toast('Agendamento cancelado.');
  });
  on('edit', async () => { m.close(); openAgForm({ ag: a }); });
  on('pront', async () => { m.close(); openProntuario(a); });
}

/* ---------- novo / editar agendamento ---------- */
function profAllows(prof, d, sMin, eMin) {
  const rows = prof.horarios || [];
  if (!rows.length) return true;
  return rows.some(r => r.dia_semana === d.getDay() && toMin(r.inicio) <= sMin && toMin(r.fim) >= eMin);
}
async function openAgForm(opts) {
  const ag = opts.ag || null;

  const procs = state.procedimentos.filter(p => p.ativo || (ag && ag.procedimento_id === p.id));
  if (!procs.length) { toast('Cadastre um procedimento antes de agendar.', 'err'); return; }
  if (!vivos.length) { toast('Cadastre um paciente antes de agendar.', 'err'); return; }
  const s = ag ? new Date(ag.inicio) : null;
  const date = ag ? ymd(s) : (opts.date || ymd(new Date()));

    <label class="field"><span>Paciente</span><input type="search" id="fPacQ" placeholder="Buscar por animal, tutor, CPF ou registro" autocomplete="off"><select id="fPac" size="5" aria-label="Paciente"></select></label>

      <label class="field"><span>Profissional</span><select id="fProf"><option value="">Sem profissional definido</option>${profs.map(p => `<option value="${p.id}" ${ag && ag.profissional_id === p.id ? 'selected' : ''}>${esc(p.nome)}${p.cargo ? ' — ' + esc(p.cargo) : ''}</option>`).join('')}</select></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Data</span><input type="date" id="fDate" value="${date}"></label>
      <label class="field"><span>Horário</span><input type="time" id="fTime" step="300" value="${time}"></label>
    </div>
    <p class="hint" id="fInfo"></p>
    <label class="field"><span>Observações</span><textarea id="fObs">${esc(ag ? ag.observacoes || '' : '')}</textarea></label></div>`;
  const m = openModal({ title: ag ? 'Editar agendamento' : 'Novo agendamento', body, footer: `<button class="btn ghost" data-close2>Cancelar</button><button class="btn" id="fSave">Salvar agendamento</button>` });
  $('[data-close2]', m).onclick = () => m.close();
  const sel = $('#fPac', m); let chosen = ag ? ag.paciente_id : '';
  const fillPac = () => {
    const q = $('#fPacQ', m).value.trim();

    sel.innerHTML = list.map(p => `<option value="${p.id}" ${p.id === chosen ? 'selected' : ''}>${esc(p.nome)} — ${esc(p.tutores ? p.tutores.nome : '')}${p.registro ? ' (' + esc(p.registro) + ')' : ''}</option>`).join('');
    if (list.length === 1) { sel.value = list[0].id; chosen = list[0].id; }
  };
  sel.onchange = () => { chosen = sel.value; };
  $('#fPacQ', m).oninput = fillPac; fillPac();
  const info = () => {
    const proc = state.procedimentos.find(p => p.id === $('#fProc', m).value), t = $('#fTime', m).value;
    if (!proc || !t) { $('#fInfo', m).textContent = ''; return; }
    const end = toMin(t) + Math.round(Number(proc.duracao_horas) * 60);
    $('#fInfo', m).textContent = `Duração de ${fmtHoras(proc.duracao_horas)}: termina às ${pad(Math.floor(end / 60) % 24)}:${pad(end % 60)}. Valor ${money(proc.preco)}.`;
  };
  $('#fProc', m).onchange = info; $('#fTime', m).oninput = info; info();
  $('#fSave', m).onclick = e => busy(e.currentTarget, async () => {
    const pacId = sel.value || chosen;
    if (!pacId) { toast('Selecione um paciente.', 'err'); return; }

    const d = $('#fDate', m).value, t = $('#fTime', m).value;
    if (!d || !t) { toast('Informe a data e o horário.', 'err'); return; }

      toast(profId ? 'Esse profissional já tem um atendimento nesse horário.' : 'Já existe um agendamento nesse horário.', 'err'); return;
    }
    const payload = { paciente_id: pacId, procedimento_id: proc.id, profissional_id: profId, inicio: inicio.toISOString(), fim: fim.toISOString(), observacoes: $('#fObs', m).value.trim() || null };
    const { error } = ag ? await sb.from('agendamentos').update(payload).eq('id', ag.id) : await sb.from('agendamentos').insert(payload);
    if (error) { fail(error, 'Não foi possível salvar o agendamento.'); return; }
    m.close(); toast(ag ? 'Agendamento atualizado.' : 'Agendamento criado.');
    const wk = mondayOf(inicio);
    if (+wk !== +agenda.start) agenda.start = wk;
    await loadAgenda();
  });
}

const pac = { tab: 'lista', obito: false, q: '' };

function matchPac(p, q) {
  const t = p.tutores || {};
  const nq = norm(q), dq = digits(q);
  const blob = norm([p.nome, p.registro, p.raca, t.nome].join(' '));
  return blob.includes(nq) || (dq.length > 0 && (digits(t.cpf).includes(dq) || digits(p.registro).includes(dq)));
}

function patientPicker(root, onPick) {
  root.innerHTML = `<div class="search">${ico('search')}<input type="search" data-pp placeholder="CPF do tutor, registro ou nome do animal" autocomplete="off"></div><div class="pp-list" data-pplist></div>`;
  const input = $('[data-pp]', root), list = $('[data-pplist]', root);
  const draw = async () => {
    const all = await getPacientes(), q = input.value.trim();
    if (!q) { list.innerHTML = '<p class="muted pp-hint">Digite o CPF do tutor, o registro ou o nome do animal para identificar o paciente.</p>'; return; }
    const res = all.filter(p => matchPac(p, q)).slice(0, 8);
    list.innerHTML = res.length ? res.map(p => `<button class="pp-item" data-id="${p.id}"><strong>${esc(p.nome)}</strong>${p.obito ? '<span class="badge b-obito">Óbito</span>' : ''}<span class="muted">Registro ${esc(p.registro || '—')}</span><span class="muted">Tutor ${esc(p.tutores ? p.tutores.nome : '—')}</span><span class="muted">CPF ${esc(maskCPF(p.tutores ? p.tutores.cpf : ''))}</span></button>`).join('')
      : '<p class="muted pp-hint">Nenhum paciente encontrado.</p>';
    $$('.pp-item', list).forEach(b => b.onclick = () => { list.innerHTML = ''; onPick(all.find(x => x.id === b.dataset.id)); });
  };
  input.addEventListener('input', draw); draw();
}
function patientHead(p) {

}

      <div>${x.arquivo_path ? `<button class="btn ghost sm" data-open="${esc(x.arquivo_path)}">Abrir</button>` : ''}${isAdmin() ? ` <button class="icon-btn" data-del="${x.id}" data-path="${esc(x.arquivo_path || '')}" aria-label="Excluir exame">${ico('trash')}</button>` : ''}</div></div>`).join('') : '<p class="muted">Nenhum exame anexado a este paciente.</p>'}</div>`;
  $('#exAdd').onclick = e => busy(e.currentTarget, async () => {
    const nome = $('#exNome').value.trim();
    if (!nome) { toast('Informe o nome do exame.', 'err'); return; }

      path = `${state.clinica.id}/${exSel.id}/${Date.now()}-${safe}`;
      const { error: ue } = await sb.storage.from('exames').upload(path, f, { upsert: false, contentType: f.type || undefined });
      if (ue) { fail(ue, 'Não foi possível enviar o arquivo. Confirme que o bucket “exames” foi criado no Supabase.'); return; }
    }
    const { error } = await sb.from('exames').insert({ paciente_id: exSel.id, nome, data_exame: $('#exData').value || null, observacoes: $('#exObs').value.trim() || null, arquivo_path: path });

  });
  $$('[data-open]', panel).forEach(b => b.onclick = async () => {
    const w = window.open('', '_blank');
    const { data: s, error: e } = await sb.storage.from('exames').createSignedUrl(b.dataset.open, 120);
    if (e) { if (w) w.close(); fail(e, 'Não foi possível abrir o arquivo.'); return; }
    if (w) w.location = s.signedUrl; else window.location = s.signedUrl;
  });
  $$('[data-del]', panel).forEach(b => b.onclick = async () => {
    if (!(await confirmBox('Excluir este exame e o arquivo anexado?', 'Excluir', true))) return;
    if (b.dataset.path) await sb.storage.from('exames').remove([b.dataset.path]);
    const { error: e } = await sb.from('exames').delete().eq('id', b.dataset.del);
    if (e) fail(e); else { toast('Exame excluído.'); renderExPanel(); }
  });
}

let vcSel = null;
const VC_CATS = [['vacina', 'Registro de vacinas'], ['vermifugo', 'Vermifugação'], ['ectoparasita', 'Ectoparasitas']];
function pacVacinas() {
  $('#pacActions').innerHTML = '';

function vcRow(r, cat) {

  return `<tr data-id="${r.id || ''}" data-cat="${cat}">

async function vcLoad() {

async function renderVcPanel() {

  const rows = await vcLoad();
  const p = vcSel, t = p.tutores || {};
  panel.innerHTML = `<div class="card"><div class="page-head" style="margin-bottom:var(--sp-4)"><div>${patientHead(p)}</div><div class="head-actions"><button class="btn ghost" id="vcPrint">${ico('printer', 18)}Imprimir PDF</button></div></div>

      <div><small>Espécie</small>${esc(p.especies ? p.especies.nome : '—')}</div><div><small>Raça</small>${esc(p.raca || '—')}</div><div><small>Pelagem/cor</small>${esc(p.pelagem_cor || '—')}</div>

      <div class="table-wrap"><table class="vc-table"><thead><tr><th>Data</th><th>Produto</th><th>Lote</th><th>Peso (kg)</th><th>Responsável</th><th>Próxima dose</th><th></th></tr></thead>

  $('#vcPrint').onclick = () => printVacinas();

async function vcSave(tr) {
  if (tr._busy) { tr._again = true; return; }
  const vals = {};
  $$('[data-f]', tr).forEach(i => { vals[i.dataset.f] = i.value.trim() || null; });
  if (vals.peso_kg != null) vals.peso_kg = Number(vals.peso_kg);
  if (!vals.nome) { if (tr.dataset.id) toast('O campo Produto é obrigatório.', 'err'); return; }
  tr._busy = true;
  const payload = { ...vals, categoria: tr.dataset.cat, paciente_id: vcSel.id };
  let error;
  if (tr.dataset.id) ({ error } = await sb.from('vacinas').update(payload).eq('id', tr.dataset.id));
  else {
    const r = await sb.from('vacinas').insert(payload).select('id').single();
    error = r.error; if (!error) tr.dataset.id = r.data.id;
  }
  tr._busy = false;
  if (error) fail(error, 'Não foi possível salvar a linha.');
  else { tr.classList.add('saved'); setTimeout(() => tr.classList.remove('saved'), 900); }
  if (tr._again) { tr._again = false; vcSave(tr); }
}
async function printVacinas() {
  const rows = await vcLoad(), p = vcSel;
  const tbl = (cat, label) => {

/* --- endereço com busca por CEP --- */
async function lookupCEP(cep) {
  cep = digits(cep);
  if (cep.length !== 8) return null;
  try { const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`); const j = await r.json(); return j.erro ? null : j; } catch (e) { return null; }
}
function addressHTML(c) {
  c = c || {};
  return `<div data-addr class="grid1">
    <label class="field"><span>CEP</span><div class="inline"><input type="text" data-f="cep" data-mask="cep" inputmode="numeric" value="${esc(maskCEP(c.cep))}" placeholder="00000-000"><button type="button" class="btn ghost" data-cepbtn>Buscar</button></div></label>
    <p class="hint" data-cephint>Digite o CEP para preencher o endereço automaticamente.</p>
    <div class="grid2"><label class="field"><span>Estado</span><input type="text" data-f="estado" maxlength="2" value="${esc(c.estado || '')}" placeholder="UF"></label>
    <label class="field"><span>Cidade</span><input type="text" data-f="cidade" value="${esc(c.cidade || '')}"></label>
    <label class="field"><span>Bairro</span><input type="text" data-f="bairro" value="${esc(c.bairro || '')}"></label>
    <label class="field"><span>Rua</span><input type="text" data-f="rua" value="${esc(c.rua || '')}"></label>
    <label class="field"><span>Número</span><input type="text" data-f="numero" value="${esc(c.numero || '')}"></label></div></div>`;
}
function bindAddress(root) {
  const f = k => $(`[data-f=${k}]`, root), hint = $('[data-cephint]', root);
  const run = async () => {
    const cep = digits(f('cep').value);
    if (cep.length !== 8) { hint.textContent = 'Digite os 8 números do CEP.'; return; }
    hint.textContent = 'Buscando…';
    const j = await lookupCEP(cep);
    if (!j) { hint.textContent = 'CEP não encontrado. Preencha manualmente, nesta ordem: estado, cidade, bairro, rua e número.'; f('estado').focus(); return; }
    f('estado').value = j.uf || ''; f('cidade').value = j.localidade || ''; f('bairro').value = j.bairro || ''; f('rua').value = j.logradouro || '';
    hint.textContent = 'Endereço encontrado. Informe o número.'; f('numero').focus();
  };
  $('[data-cepbtn]', root).onclick = run;
  f('cep').addEventListener('input', () => { if (digits(f('cep').value).length === 8) run(); });
}
function readAddress(root) {
  const g = k => $(`[data-f=${k}]`, root).value.trim();
  return { cep: digits(g('cep')) || null, estado: g('estado').toUpperCase() || null, cidade: g('cidade') || null, bairro: g('bairro') || null, rua: g('rua') || null, numero: g('numero') || null };
}

  return `<div data-hours class="grid1">
    <label class="switch"><input type="checkbox" data-f="variavel" ${variavel ? 'checked' : ''}><span class="sw"></span><span>O horário não é igual em todos os dias</span></label>
    <div data-uni ${variavel ? 'hidden' : ''}><div class="hrow uni"><span class="hday">Todos os dias</span><label>Abre <input type="time" data-f="uni-abre" value="${uni.abre}"></label><label>Fecha <input type="time" data-f="uni-fecha" value="${uni.fecha}"></label></div></div>
    <div data-var ${variavel ? '' : 'hidden'}>${rows.map(r => `<div class="hrow" data-d="${r.d}"><span class="hday">${DIAS[r.d]}</span><label class="check"><input type="checkbox" data-f="aberto" ${r.fechado ? '' : 'checked'}> Aberto</label><label>Abre <input type="time" data-f="abre" value="${r.abre}"></label><label>Fecha <input type="time" data-f="fecha" value="${r.fecha}"></label></div>`).join('')}</div></div>`;
}
function bindHours(root) {
  const sw = $('[data-f=variavel]', root);
  sw.onchange = () => { $('[data-uni]', root).hidden = sw.checked; $('[data-var]', root).hidden = !sw.checked; };
}
function readHours(root) {
  const variavel = $('[data-f=variavel]', root).checked, rows = [];
  if (!variavel) {
    const abre = $('[data-f=uni-abre]', root).value, fecha = $('[data-f=uni-fecha]', root).value;
    if (!abre || !fecha || toMin(abre) >= toMin(fecha)) return { error: 'O horário de abertura precisa ser antes do fechamento.' };
    for (let d = 0; d < 7; d++) rows.push({ dia_semana: d, abre, fecha, fechado: false });
  } else {
    for (const row of $$('.hrow', $('[data-var]', root))) {
      const d = Number(row.dataset.d), aberto = $('[data-f=aberto]', row).checked, abre = $('[data-f=abre]', row).value, fecha = $('[data-f=fecha]', row).value;
      if (aberto && (!abre || !fecha || toMin(abre) >= toMin(fecha))) return { error: `Confira o horário de ${DIAS[d].toLowerCase()}: a abertura precisa ser antes do fechamento.` };
      rows.push({ dia_semana: d, abre: aberto ? abre : null, fecha: aberto ? fecha : null, fechado: !aberto });
    }
  }
  return { variavel, rows };
}
async function saveHours(r) {
  const rows = r.rows.map(x => ({ ...x, clinica_id: state.clinica.id }));
  const { error } = await sb.from('horarios_funcionamento').upsert(rows, { onConflict: 'clinica_id,dia_semana' });
  if (error) { fail(error, 'Não foi possível salvar os horários.'); return false; }
  const { error: e2 } = await sb.from('clinicas').update({ horario_variavel: r.variavel }).eq('id', state.clinica.id);
  if (e2) { fail(e2); return false; }
  state.clinica.horario_variavel = r.variavel;
  const { data } = await sb.from('horarios_funcionamento').select('*');
  state.horarios = data || [];
  return true;
}

/* --- seções --- */
function cfgEmpresa() {
  const c = state.clinica, ro = !isAdmin();
  $('#cfgBody').innerHTML = `<div class="card">${onlyAdminNote()}<div class="grid1" id="empForm">
    <div class="grid2"><label class="field"><span>Nome do negócio</span><input type="text" id="cNome" value="${esc(c.nome)}"></label>
    <label class="field"><span>Telefone da empresa</span><input type="text" id="cTel" data-mask="phone" inputmode="tel" value="${esc(c.telefone || '')}" placeholder="(00) 00000-0000"></label></div>
    <p class="section-title">Localização</p>${addressHTML(c)}
    <div><button class="btn" id="cSave">Salvar empresa</button></div></div></div>`;
  bindAddress($('#empForm'));
  if (ro) $$('#empForm input,#empForm button').forEach(i => { i.disabled = true; });
  $('#cSave').onclick = e => busy(e.currentTarget, async () => {
    const nome = $('#cNome').value.trim();
    if (!nome) { toast('Informe o nome do negócio.', 'err'); return; }
    const row = { nome, telefone: $('#cTel').value.trim() || null, ...readAddress($('[data-addr]')) };
    const { data, error } = await sb.from('clinicas').update(row).eq('id', c.id).select().single();
    if (error) { fail(error, 'Não foi possível salvar a empresa.'); return; }
    state.clinica = data; toast('Dados da empresa salvos.');
  });
}
function cfgHorarios() {
  $('#cfgBody').innerHTML = `<div class="card">${onlyAdminNote()}${hoursHTML()}<div style="margin-top:var(--sp-5)"><button class="btn" id="hSave">Salvar horários</button></div></div>`;
  const root = $('[data-hours]'); bindHours(root);
  if (!isAdmin()) $$('#cfgBody input,#cfgBody button').forEach(i => { i.disabled = true; });
  $('#hSave').onclick = e => busy(e.currentTarget, async () => {
    const r = readHours(root);
    if (r.error) { toast(r.error, 'err'); return; }
    if (await saveHours(r)) toast('Horários salvos.');
  });
}
function profResumo(p) {
  const rows = (p.horarios || []).slice().sort((a, b) => ORDEM_DIAS.indexOf(a.dia_semana) - ORDEM_DIAS.indexOf(b.dia_semana));
  return rows.length ? rows.map(r => `${DIAS_CURTOS[r.dia_semana]} ${r.inicio.slice(0, 5)}–${r.fim.slice(0, 5)}`).join(', ') : 'Sem horários definidos (atende em qualquer horário da clínica)';
}
function cfgProfissionais() {
  $('#cfgBody').innerHTML = `<div class="card">${onlyAdminNote()}<div class="page-head" style="margin-bottom:var(--sp-3)"><h3>Equipe</h3>${isAdmin() ? `<button class="btn" id="profNew">${ico('plus')}Novo profissional</button>` : ''}</div>
    ${state.profissionais.length ? state.profissionais.map(p => `<div class="list-row"><div><strong>${esc(p.nome)}</strong>${p.cargo ? ' — ' + esc(p.cargo) : ''} ${p.ativo ? '' : '<span class="badge">Inativo</span>'}<div class="sub">${esc(profResumo(p))}</div></div>${isAdmin() ? `<button class="icon-btn" data-pe="${p.id}" aria-label="Editar ${esc(p.nome)}">${ico('edit')}</button>` : ''}</div>`).join('') : '<p class="muted">Nenhum profissional cadastrado.</p>'}</div>`;
  const n = $('#profNew'); if (n) n.onclick = () => openProfForm(null);
  $$('[data-pe]').forEach(b => b.onclick = () => openProfForm(state.profissionais.find(x => x.id === b.dataset.pe)));
}
function openProfForm(p) {
  const body = `<div class="grid2"><label class="field"><span>Nome</span><input type="text" id="prfNome" data-mask="name" value="${esc(p ? p.nome : '')}"></label>
    <label class="field"><span>Cargo</span><input type="text" id="prfCargo" value="${esc(p ? p.cargo || '' : '')}" placeholder="Ex.: Médica veterinária"></label></div>
    <label class="check"><input type="checkbox" id="prfAtivo" ${!p || p.ativo ? 'checked' : ''}> Profissional ativo</label>
    <p class="section-title">Horários de atendimento</p><p class="hint">Se nenhum dia for marcado, o profissional atende em qualquer horário de funcionamento da clínica.</p>
    <div id="prfHours">${ORDEM_DIAS.map(d => { const h = p && (p.horarios || []).find(x => x.dia_semana === d);
      return `<div class="hrow" data-d="${d}"><span class="hday">${DIAS[d]}</span><label class="check"><input type="checkbox" data-f="on" ${h ? 'checked' : ''}> Atende</label><label>Início <input type="time" data-f="ini" value="${h ? h.inicio.slice(0, 5) : '08:00'}"></label><label>Fim <input type="time" data-f="fim" value="${h ? h.fim.slice(0, 5) : '12:00'}"></label></div>`; }).join('')}</div>`;
  const m = openModal({ title: p ? 'Editar profissional' : 'Novo profissional', wide: true, body, footer: `<button class="btn ghost" data-c>Cancelar</button><button class="btn" id="prfSave">Salvar profissional</button>` });
  $('[data-c]', m).onclick = () => m.close();
  $('#prfSave', m).onclick = e => busy(e.currentTarget, async () => {
    const nome = $('#prfNome', m).value.trim();
    if (!nome) { toast('Informe o nome do profissional.', 'err'); return; }
    const hrs = [];
    for (const row of $$('.hrow', $('#prfHours', m))) {
      if (!$('[data-f=on]', row).checked) continue;
      const ini = $('[data-f=ini]', row).value, fim = $('[data-f=fim]', row).value;
      if (!ini || !fim || toMin(ini) >= toMin(fim)) { toast(`Confira o horário de ${DIAS[Number(row.dataset.d)].toLowerCase()}.`, 'err'); return; }
      hrs.push({ dia_semana: Number(row.dataset.d), inicio: ini, fim });
    }
    const info = { nome, cargo: $('#prfCargo', m).value.trim() || null, ativo: $('#prfAtivo', m).checked };
    let id = p && p.id;
    if (id) { const { error } = await sb.from('profissionais').update(info).eq('id', id); if (error) { fail(error); return; } }
    else { const { data, error } = await sb.from('profissionais').insert(info).select('id').single(); if (error) { fail(error); return; } id = data.id; }
    const { error: de } = await sb.from('profissional_horarios').delete().eq('profissional_id', id);
    if (de) { fail(de); return; }
    if (hrs.length) {
      const { error: ie } = await sb.from('profissional_horarios').insert(hrs.map(h => ({ ...h, profissional_id: id })));
      if (ie) { fail(ie); return; }
    }
    await loadRefs(); m.close(); toast('Profissional salvo.'); if (state.page === 'config') drawCfg();
  });
}
function cfgEspecies() {
  $('#cfgBody').innerHTML = `<div class="card">${onlyAdminNote()}<h3 style="margin-bottom:var(--sp-2)">Espécies atendidas</h3><p class="hint" style="margin-bottom:var(--sp-4)">Só as espécies desta lista aparecem no cadastro de pacientes.</p>
    <div class="inline" style="margin-bottom:var(--sp-4)"><input type="text" id="espNome" data-mask="name" placeholder="Nova espécie" ${isAdmin() ? '' : 'disabled'}><button class="btn" id="espAdd" ${isAdmin() ? '' : 'disabled'}>Adicionar</button></div>
    ${state.especies.map(e => `<div class="list-row"><span>${esc(e.nome)}</span>${isAdmin() ? `<button class="icon-btn" data-ed="${e.id}" aria-label="Remover ${esc(e.nome)}">${ico('trash')}</button>` : ''}</div>`).join('') || '<p class="muted">Nenhuma espécie cadastrada.</p>'}</div>`;
  const add = () => busy($('#espAdd'), async () => {
    const nome = $('#espNome').value.trim();
    if (!nome) return;
    const { error } = await sb.from('especies').insert({ nome });
    if (error) { fail(error, 'Não foi possível adicionar a espécie.'); return; }
    await loadRefs(); drawCfg();
  });
  $('#espAdd').onclick = add;
  $('#espNome').onkeydown = e => { if (e.key === 'Enter') add(); };
  $$('[data-ed]').forEach(b => b.onclick = async () => {
    if (!(await confirmBox('Remover esta espécie?', 'Remover', true))) return;
    const { error } = await sb.from('especies').delete().eq('id', b.dataset.ed);
    if (error) { toast(error.code === '23503' ? 'Há pacientes cadastrados com esta espécie. Ela não pode ser removida.' : sbErr(error), 'err'); return; }
    await loadRefs(); drawCfg();
  });
}
async function cfgUsuarios() {
  $('#cfgBody').innerHTML = `<div class="card"><h3 style="margin-bottom:var(--sp-2)">Usuários com acesso</h3><div class="loading">Carregando…</div></div>`;
  const { data, error } = await sb.from('perfis').select('*').order('criado_em');
  if (error) { fail(error); return; }
  const PAPEL = { admin: 'Administrador', profissional: 'Profissional', recepcao: 'Recepção' };
  $('#cfgBody').innerHTML = `<div class="card"><h3 style="margin-bottom:var(--sp-2)">Usuários com acesso</h3>
    ${data.map(u => `<div class="list-row"><div><strong>${esc(u.nome_usuario)}</strong>${u.id === state.uid ? ' <span class="badge b-agendado">Você</span>' : ''}<div class="sub">${PAPEL[u.papel] || esc(u.papel)}, criado em ${fmtDate(u.criado_em)}</div></div></div>`).join('')}</div>`;
}
const TABELAS = { clinicas: 'Empresa', perfis: 'Usuários', horarios_funcionamento: 'Horário de funcionamento', profissionais: 'Profissionais', profissional_horarios: 'Horário de profissional', especies: 'Espécies', procedimentos: 'Procedimentos', tutores: 'Tutores', pacientes: 'Pacientes', agendamentos: 'Agendamentos', financeiro: 'Financeiro', prontuarios: 'Prontuários', exames: 'Exames', vacinas: 'Vacinas' };
const ACOES = { INSERT: 'Criou', UPDATE: 'Alterou', DELETE: 'Excluiu' };
async function cfgHistorico() {
  if (!isAdmin()) { $('#cfgBody').innerHTML = `<div class="card">${onlyAdminNote()}</div>`; return; }
  $('#cfgBody').innerHTML = `<div class="card"><div class="page-head" style="margin-bottom:var(--sp-3)"><div><h3>Histórico de alterações</h3><p class="hint">As 200 alterações mais recentes. Elas são gravadas pelo banco e não podem ser editadas.</p></div>
    <select id="hFiltro" class="select-sm" aria-label="Filtrar por área"><option value="">Todas as áreas</option>${Object.entries(TABELAS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div><div id="hBody"><div class="loading">Carregando…</div></div></div>`;
  const load = async () => {
    let q = sb.from('audit_log').select('*').order('criado_em', { ascending: false }).limit(200);
    const f = $('#hFiltro').value; if (f) q = q.eq('tabela', f);
    const { data, error } = await q;
    if (error) { fail(error); return; }
    $('#hBody').innerHTML = data.length ? `<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th>Registro</th><th></th></tr></thead><tbody>
      ${data.map((r, i) => { const d = r.dados_novos || r.dados_antigos || {};
        return `<tr><td>${fmtDateTime(r.criado_em)}</td><td>${esc(r.usuario_email || 'Sistema')}</td><td>${ACOES[r.acao]} em ${esc(TABELAS[r.tabela] || r.tabela)}</td><td>${esc(d.nome || d.status || d.dia_semana || '')}</td><td class="actions"><button class="btn ghost sm" data-log="${i}">Detalhes</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">Nenhuma alteração registrada.</p>';
    $$('[data-log]').forEach(b => b.onclick = () => showDiff(data[Number(b.dataset.log)]));
  };
  $('#hFiltro').onchange = load; load();
}
function showDiff(r) {
  const o = r.dados_antigos || {}, n = r.dados_novos || {}, skip = ['id', 'clinica_id', 'criado_em', 'atualizado_em'];
  const keys = [...new Set([...Object.keys(o), ...Object.keys(n)])].filter(k => !skip.includes(k) && JSON.stringify(o[k]) !== JSON.stringify(n[k]) || (r.acao !== 'UPDATE' && !skip.includes(k)));
  const val = v => v == null ? '—' : typeof v === 'object' ? JSON.stringify(v) : String(v);
  openModal({ title: `${ACOES[r.acao]} em ${TABELAS[r.tabela] || r.tabela}`, wide: true, body: `<p class="muted">${fmtDateTime(r.criado_em)} por ${esc(r.usuario_email || 'Sistema')}</p>
    <div class="diff"><span class="h">Campo</span><span class="h">Antes</span><span class="h">Depois</span>${keys.map(k => `<span>${esc(k)}</span><span class="old">${esc(val(o[k]))}</span><span class="new">${esc(val(n[k]))}</span>`).join('')}</div>` });
}
function cfgConta() {
  $('#cfgBody').innerHTML = `<div class="card"><h3 style="margin-bottom:var(--sp-3)">Sua conta</h3><dl class="kv"><dt>Usuário</dt><dd>${esc(state.perfil.nome_usuario)}</dd><dt>E-mail</dt><dd>${esc(state.email)}</dd><dt>Acesso</dt><dd>${({ admin: 'Administrador', profissional: 'Profissional', recepcao: 'Recepção' })[state.perfil.papel] || esc(state.perfil.papel)}</dd></dl>
    <div style="margin-top:var(--sp-5)"><button class="btn ghost danger" id="outBtn">${ico('logout', 18)}Sair</button></div></div>`;
  $('#outBtn').onclick = logout;
}

/* =====================================================================
   PRIMEIRO ACESSO: horário e localização
   ===================================================================== */
function startOnboarding() {
  const body = `<div data-step="1" class="grid1"><p class="muted">Primeiro, informe os dias e horários de funcionamento.</p>${hoursHTML()}</div>
    <div data-step="2" class="grid1" hidden><p class="muted">Agora, a localização da clínica.</p>${addressHTML(state.clinica)}</div>`;
  const m = openModal({ title: 'Vamos configurar sua clínica', locked: true, wide: true, body, footer: `<button class="btn ghost" id="obBack" hidden>Voltar</button><button class="btn" id="obNext">Continuar</button>` });
  const s1 = $('[data-step="1"]', m), s2 = $('[data-step="2"]', m);
  bindHours($('[data-hours]', m)); bindAddress($('[data-addr]', m));
  let step = 1, hours = null;
  const show = n => { step = n; s1.hidden = n !== 1; s2.hidden = n !== 2; $('#obBack', m).hidden = n !== 2; $('#obNext', m).textContent = n === 1 ? 'Continuar' : 'Concluir'; };
  $('#obBack', m).onclick = () => show(1);
  $('#obNext', m).onclick = e => busy(e.currentTarget, async () => {
    if (step === 1) {
      hours = readHours($('[data-hours]', m));
      if (hours.error) { toast(hours.error, 'err'); return; }
      show(2); return;
    }
    const addr = readAddress($('[data-addr]', m));
    if (!addr.cidade || !addr.estado) { toast('Informe ao menos o estado e a cidade.', 'err'); return; }
    if (!(await saveHours(hours))) return;
    const { data, error } = await sb.from('clinicas').update(addr).eq('id', state.clinica.id).select().single();
    if (error) { fail(error); return; }
    state.clinica = data; m.shut(); toast('Clínica configurada. Bem-vindo!');
  });
}
